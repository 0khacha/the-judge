name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check the_judge/ tests/
          mypy the_judge/

      - name: Tests
        run: pytest tests/

  walkthrough:
    # The examples/simple_cache walk-through, end to end, through the installed CLI.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install from the source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist .
          pip install dist/*.tar.gz
          judge --version

      - name: Freeze, buggy implementation (FAIL), correct implementation (PASS)
        run: |
          cp -r examples/simple_cache /tmp/sc && cd /tmp/sc
          judge freeze .
          cp solutions/cache_off_by_one.py cache.py
          set +e; judge verify .; code=$?; set -e
          test "$code" -eq 1 || { echo "expected FAIL (1), got $code"; exit 1; }
          cp solutions/cache_correct.py cache.py
          judge verify .

      - name: Stop hook blocks a failing turn
        run: |
          cd /tmp/sc
          cp solutions/cache_off_by_one.py cache.py
          echo '{"hook_event_name": "Stop", "cwd": "/tmp/sc"}' | judge hook run | tee out.json
          grep -q '"decision": "block"' out.json
