<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Main circle - represents wholeness/completion -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#tealGrad)" stroke-width="4"/>

  <!-- Checkmark/verification symbol - clean and centered -->
  <path d="M 65 100 L 88 123 L 135 70"
        fill="none"
        stroke="url(#tealGrad)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Three ascending levels - represents continuous improvement -->
  <g opacity="0.7">
    <rect x="40" y="145" width="35" height="6" rx="3" fill="#0ea5e9"/>
    <rect x="82" y="135" width="35" height="6" rx="3" fill="#0ea5e9"/>
    <rect x="124" y="125" width="35" height="6" rx="3" fill="#0ea5e9"/>
  </g>

  <!-- Subtle circular arrow hint at top - continuous cycle -->
  <path d="M 100 15 A 85 85 0 0 1 170 60"
        fill="none"
        stroke="#0ea5e9"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.4"/>
  <polygon points="172,58 175,65 166,63" fill="#0ea5e9" opacity="0.4"/>
</svg>
